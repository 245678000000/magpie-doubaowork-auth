name: Test plugin
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - name: Validate package contents
        run: npm pack --ignore-scripts --dry-run
  windows-browser:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - run: bun run scripts/isolated-browser-smoke.mjs
      # The vendor client is never present on a public runner, so this prints
      # SKIP and exits 0; it still guards the skip path against bit-rot.
      - run: bun run scripts/doubao-browser-smoke.mjs
  linux-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      # Existing runner Xvfb, a real DISPLAY, a non-root user and sandbox intact.
      - run: xvfb-run -a bun run scripts/isolated-browser-smoke.mjs
